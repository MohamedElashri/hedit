[package]
name = "hedit-plugin-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
hedit-plugin = { path = "../crates/hedit-plugin", features = ["fuzzing"] }
hedit-protocol = { path = "../crates/hedit-protocol" }

[[bin]]
name = "sdk_protocol"
path = "fuzz_targets/sdk_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lsp_wire"
path = "fuzz_targets/lsp_wire.rs"
test = false
doc = false
bench = false
