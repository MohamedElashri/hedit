[package]
name = "hedit"
version = "0.6.2"
edition = "2021"
rust-version = "1.99"
description = "A native text editor with durable recovery, Git, and private SSH workspaces"
license = "MIT"

[workspace]
members = ["crates/hedit-remote", "crates/hedit-core", "crates/hedit-plugin", "crates/hedit-broker", "crates/hedit-protocol", "crates/hedit-json-tools"]
default-members = ["."]
exclude = ["vendor/egui", "vendor/epaint"]
resolver = "2"

[[example]]
name = "remote_workspace_probe"
path = "tests/support/remote_workspace_probe.rs"

[features]
default = ["terminal"]
terminal = ["dep:libghostty-vt", "dep:portable-pty", "dep:rustybuzz"]

[dependencies]
getrandom = "0.4"
hedit-core = { path = "crates/hedit-core" }
hedit-plugin = { path = "crates/hedit-plugin" }
hedit-broker = { path = "crates/hedit-broker" }
hedit-remote = { path = "crates/hedit-remote" }
libghostty-vt = { version = "=0.2.2", default-features = false, optional = true }
portable-pty = { version = "0.9", optional = true }
rustybuzz = { version = "0.20.1", optional = true }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
memchr = "2"
directories = "6"
semver = "1"
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
zeroize = "1"
regex = "1.13.1"
encoding_rs = "0.8.42"
trash = "5.2.9"
similar = "3.2.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-onig"] }
unicode-bidi = "0.3"
ab_glyph = "0.2.32"
spellbook = "0.4.2"
egui_commonmark = { version = "0.20.0", default-features = false }
# Decode images through Markdown's bounded loader; never install the generic
# file:// loader, which bypasses its size, file-type, and worker limits.
egui_extras = { version = "0.31.1", default-features = false, features = ["image"] }
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
latex-rust = "3.0.1"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts"] }
notify = "8.2.0"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
libc = "0.2"

# GNOME on Wayland leaves window decorations to the app; draw Adwaita-style
# title bar buttons instead of winit's bare fallback frame.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }
raw-window-handle = "0.6"
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(target_os = "macos")'.dependencies.eframe]
version = "0.31.1"
default-features = false
features = ["accesskit"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSValue", "NSObject", "NSString", "NSUserDefaults"] }
plist = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Exercise successive trees with the same consumer as the native adapter.
accesskit_consumer = "=0.26.0"

# Native editor row sharing and document layout; see DEVELOPER_GUIDE.md
# and vendor/egui_commonmark/PATCH.md.
[patch.crates-io]
egui = { path = "vendor/egui" }
epaint = { path = "vendor/epaint" }
egui_commonmark = { path = "vendor/egui_commonmark" }
# Select Ghostty's required Zig compiler for normal Cargo and Make builds.
libghostty-vt-sys = { path = "vendor/libghostty-vt-sys" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
hedit-plugin = { path = "crates/hedit-plugin", features = ["test-support"] }
