[package]
name = "hedit"
version = "0.1.12"
edition = "2021"
rust-version = "1.92"
description = "A native text and log editor with durable unsaved files and CUDA debugging"
license = "MIT"

[features]
default = ["terminal"]
terminal = ["dep:libghostty-vt", "dep:portable-pty", "dep:rustybuzz"]

[dependencies]
libghostty-vt = { version = "=0.2.2", default-features = false, optional = true }
portable-pty = { version = "0.9", optional = true }
rustybuzz = { version = "0.20.1", optional = true }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
memchr = "2"
directories = "6"
semver = "1"
sha2 = "0.11"
regex = "1.13.1"
encoding_rs = "0.8.42"
ignore = "0.4.33"
trash = "5.2.9"
similar = "3.2.0"
globset = "0.4.20"
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-onig"] }
unicode-bidi = "0.3"
ab_glyph = "0.2.32"
spellbook = "0.4.2"
egui_commonmark = { version = "0.20.0", default-features = false, features = ["load-images"] }
pulldown-cmark = { version = "0.12.2", default-features = false }
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
latex-rust = "2.1.1"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

# GNOME on Wayland leaves window decorations to the app; draw Adwaita-style
# title bar buttons instead of winit's bare fallback frame.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Threading"] }

# Process nested Markdown blocks normally; see vendor/egui_commonmark/PATCH.md.
[patch.crates-io]
egui_commonmark = { path = "vendor/egui_commonmark" }
# Select Ghostty's required Zig compiler for normal Cargo and Make builds.
libghostty-vt-sys = { path = "vendor/libghostty-vt-sys" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
