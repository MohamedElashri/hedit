[package]
name = "hedit"
version = "0.1.3"
edition = "2021"
rust-version = "1.92"
description = "A native text and log editor with durable unsaved files and CUDA debugging"
license = "MIT"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
memchr = "2"
directories = "6"
semver = "1"
sha2 = "0.10"
regex = "1.13.1"
encoding_rs = "0.8.42"
ignore = "0.4.33"
trash = "5.2.9"
similar = "3.2.0"
globset = "0.4.20"
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-onig"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

# GNOME on Wayland leaves window decorations to the app; draw Adwaita-style
# title bar buttons instead of winit's bare fallback frame.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
