[package]
name = "hedit-remote"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Headless SSH workspace and host-only recovery for hedit"
license = "MIT"
publish = false

[features]
# Never enabled for packaged helpers. Deterministic process-crash tests only.
test-faults = []

[dependencies]
base64 = "0.22"
hedit-core = { path = "../hedit-core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
getrandom = "0.4"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs", "process", "net"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "limits"] }
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"
