[package]
name = "hedit-core"
version = "0.7.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
hedit-protocol = { path = "../hedit-protocol" }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
memchr = "2"
regex = "1"
ignore = "0.4"
globset = "0.4"
encoding_rs = "0.8"
trash = "5"
similar = "3.2"
flate2 = "1"
tar = { version = "0.4.46", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
url = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Authorization", "Win32_System_SystemServices", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
