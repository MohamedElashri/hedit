[package]
name = "hedit-plugin"
version = "0.6.2"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mlua = { version = "=0.12.2", default-features = false, features = ["lua54", "vendored"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
tempfile = "3"
getrandom = "0.4"
hex = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }
