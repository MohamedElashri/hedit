[package]
name = "hedit-broker"
version = "0.6.2"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false

[[test]]
name = "native_continuation"
harness = false

[dependencies]
hedit-plugin = { path = "../hedit-plugin" }
hedit-core = { path = "../hedit-core" }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
serde_json = "1"
notify = "8.2.0"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
hickory-resolver = { version = "0.25", features = ["system-config", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
