name: Windows build
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checks_only:
        description: Validate without building or uploading release packages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86-64
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      # Leave CPU available for bounded asynchronous font/math rendering.
      RUST_TEST_THREADS: 2
      # Ship the C runtime in the executable for portable installations.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Build storage and cleanup tests
        run: python scripts/test-build-storage.py
      - name: Install pinned Zig for Ghostty VT
        run: python scripts/setup-zig.py
      - name: Select compatible MSVC headers for pinned Zig
        shell: pwsh
        run: |
          # Retain the current ConPTY runtime while building Zig's C++ code
          # against the installed VS 2022 compatibility toolset.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installations = & $vswhere -all -products '*' -property installationPath
          if ($LASTEXITCODE -ne 0) { throw 'Cannot locate Visual Studio installations.' }
          $toolsets = @($installations | ForEach-Object {
            Get-ChildItem (Join-Path $_ 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue
          } | Where-Object { $_.Name -like '14.44.*' } | Sort-Object Name -Descending)
          if ($toolsets.Count -eq 0) { throw 'The MSVC 14.44 compatibility toolset is required by Zig 0.15.2.' }
          $toolset = $toolsets[0].FullName
          $include = Join-Path $toolset 'include'
          $libraries = Join-Path $toolset 'lib\x64'
          if (!(Test-Path (Join-Path $include 'vcruntime.h')) -or !(Test-Path (Join-Path $libraries 'vcruntime.lib'))) {
            throw 'The selected MSVC compatibility toolset is incomplete.'
          }
          $libc = & zig libc
          if ($LASTEXITCODE -ne 0) { throw 'Cannot detect the native Windows SDK for Zig.' }
          $libc = $libc -replace '^sys_include_dir=.*$', "sys_include_dir=$include"
          $libc = $libc -replace '^msvc_lib_dir=.*$', "msvc_lib_dir=$libraries"
          $configuration = Join-Path $env:RUNNER_TEMP 'hedit-zig-msvc143.txt'
          [System.IO.File]::WriteAllText($configuration, (($libc -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
          "ZIG_LIBC=$configuration" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Pinned Zig MSVC toolset: $toolset"
      - name: Match release tag to package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check-release.py
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: windows-x86_64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --workspace --no-fail-fast
      - name: Patched renderer tests
        run: cargo test --locked -p egui -p epaint --lib
      - name: Numeric native trace tests
        run: python scripts/test-native-trace.py
      - name: SSH test fixture setup tests
        run: python scripts/test-remote-live-setup.py
      - name: Release metadata tests
        run: python scripts/test-release.py
      - name: Compiler setup tests
        run: python scripts/test-zig-setup.py
      - name: Package tests
        run: python scripts/test-windows-package.py
      - name: Build portable release
        if: ${{ !inputs.checks_only }}
        run: cargo build --release --locked --workspace
      - name: Package and verify extracted executable
        if: ${{ !inputs.checks_only }}
        run: python scripts/package-windows.py --smoke --native-broker
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !inputs.checks_only }}
        with:
          name: hedit-windows-x86_64
          path: dist/hedit-*-windows-x86_64.zip*
          if-no-files-found: error
