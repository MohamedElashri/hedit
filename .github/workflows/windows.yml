name: Windows build
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86-64
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      # Ship the C runtime in the executable for portable installations.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Match release tag to package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check-release.py
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: windows-x86_64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --no-fail-fast
      - name: Package tests
        run: python scripts/test-windows-package.py
      - name: Build portable release
        run: cargo build --release --locked
      - name: Package and verify extracted executable
        run: python scripts/package-windows.py --smoke
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hedit-windows-x86_64
          path: dist/hedit-*-windows-x86_64.zip*
          if-no-files-found: error
