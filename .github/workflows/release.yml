name: Release packages
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  validate:
    name: Lint and test before release builds
    uses: ./.github/workflows/ci.yml
    with:
      validation_only: true

  build:
    name: Linux ${{ matrix.arch }}
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Python for packaging
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Zig for Ghostty VT
        run: python scripts/setup-zig.py
      - name: Match release tag to package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make release-check
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Format, documentation, policy, and script checks
        run: make static
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: release-${{ matrix.arch }}
      - name: Clippy
        run: make clippy
      - name: Tests
        run: make test
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev desktop-file-utils cpio file xvfb xauth xdotool libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libwayland-client0 libwayland-cursor0 libwayland-egl1 libegl1 libgl1
          python3 scripts/setup-appimage.py
      - name: Package and verify every Linux format
        run: make linux-packages smoke smoke-linux-packages
      - name: Verify AppImage detached windows without FUSE
        run: xvfb-run -a python3 scripts/test-appimage.py dist/hedit-*-linux-${{ matrix.arch }}.AppImage
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hedit-linux-${{ matrix.arch }}
          path: dist/hedit-*-linux-${{ matrix.arch }}.*
          if-no-files-found: error

  macos:
    name: Build universal macOS app
    needs: [validate]
    uses: ./.github/workflows/macos.yml

  windows:
    name: Build Windows portable app
    needs: [validate]
    uses: ./.github/workflows/windows.yml

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: hedit-*
          merge-multiple: true
          path: dist
      - name: Verify the complete release asset set
        run: python3 scripts/check-release-assets.py dist
      - name: Prepare release notes from the changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release.py --notes-file release-notes.md
      - name: Upload complete release before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state; then
            if [ "$(cat release-state)" != true ]; then
              echo 'This release is already published. Use a new version tag for changes.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.AppImage dist/*.zip dist/*.sha256 --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md --title "hedit $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.AppImage dist/*.zip dist/*.sha256 \
              --verify-tag --draft --notes-file release-notes.md --title "hedit $RELEASE_TAG"
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
