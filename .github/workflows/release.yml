name: Build Linux binary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - run: python3 scripts/check-native.py
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/smoke-package.py
      - name: Package binary, documentation, and identity assets
        run: python3 scripts/package-linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: hedit-linux-x86_64
          path: dist/hedit-*-linux-x86_64.tar.gz*
