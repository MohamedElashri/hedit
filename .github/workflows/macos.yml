name: Universal macOS and protocol security
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Rebuild the universal package for an existing release tag
        type: string
        required: false
      protocol_security:
        description: Run the protocol sanitizer campaign instead of packaging
        type: boolean
        default: false
  workflow_call:
  schedule:
    - cron: '23 4 * * 1,4'

permissions:
  contents: read

jobs:
  universal:
    if: github.event_name != 'schedule' && !inputs.protocol_security
    name: Universal macOS app
    runs-on: macos-15
    timeout-minutes: 65
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - name: Validate the requested release tag
        if: inputs.release_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: make release-check
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt, clippy
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Zig for Ghostty VT
        run: python scripts/setup-zig.py
      - name: Static checks
        run: make static
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: macos-universal
      # Clippy also type-checks; the Intel slice is compiled by the release
      # build below, so lint the runner's native Apple Silicon slice only.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: make test-macos
      - name: Build architecture slices and assemble universal app
        run: |
          cargo build --release --locked --workspace --target aarch64-apple-darwin
          cargo build --release --locked --workspace --target x86_64-apple-darwin
          python3 scripts/package-macos.py
      - name: Verify the distributed app
        shell: bash
        run: |
          work=$(mktemp -d)
          ditto -x -k dist/hedit-*-macos-universal.zip "$work"
          binary="$work/hedit.app/Contents/MacOS/hedit"
          lipo "$binary" -verify_arch arm64
          lipo "$binary" -verify_arch x86_64
          codesign --verify --deep --strict "$work/hedit.app"
          expected=$(python3 -c 'import tomllib; print("hedit " + tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$("$binary" --version)" = "$expected"
          "$binary" --help
          helper="$work/hedit.app/Contents/MacOS/hedit-remote"
          lipo "$helper" -verify_arch arm64
          lipo "$helper" -verify_arch x86_64
          helper_expected=$(python3 -c 'import tomllib; print("hedit-remote " + tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$("$helper" --version)" = "$helper_expected"
          worker="$work/hedit.app/Contents/Helpers/hedit-plugin.app/Contents/MacOS/hedit"
          lipo "$worker" -verify_arch arm64
          lipo "$worker" -verify_arch x86_64
          python3 -c 'import json, pathlib, sys; pathlib.Path(sys.argv[1]).write_text(json.dumps([{"command":"markdown-quote.quote","input":"café\r\n東京","expected":"> café\n> 東京","language":"markdown"}]))' "$work/lua-fixtures.json"
          "$binary" plugin test "$work/hedit.app/Contents/Resources/Documentation/examples/extensions/markdown-quote.json" "$work/lua-fixtures.json"
          reference="$work/hedit.app/Contents/MacOS/hedit-json-tools"
          lipo "$reference" -verify_arch arm64
          lipo "$reference" -verify_arch x86_64
          test "$("$reference" --version)" = "hedit-json-tools ${expected#hedit }"
          HEDIT_REFERENCE_TOOL="$reference" HEDIT_REFERENCE_EDITOR="$binary" cargo test --locked -p hedit-json-tools --test native_reference
          examples="$work/hedit.app/Contents/Resources/Documentation/examples/extensions"
          for name in sdk-markdown sdk-table sdk-trim scoped-json scoped-rename scoped-markdown-html; do
            "$binary" plugin test "$examples/$name.json" "$examples/$name.fixtures.json"
          done
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            test "$(arch -x86_64 "$binary" --version)" = "$expected"
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hedit-macos-universal
          path: |
            dist/hedit-*-macos-universal.zip*
            dist/hedit-remote-*-macos-universal*
          if-no-files-found: error

  codec:
    if: github.event_name == 'schedule' || inputs.protocol_security
    concurrency:
      group: plugin-security-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        target: [sdk_protocol, lsp_wire]
    name: AddressSanitizer protocol fuzzing (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-19
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Fuzz bounded requests, replies, and transactions
        run: python scripts/fuzz-plugin-codec.py --target ${{ matrix.target }} --sanitizer address --seconds 600 --out-dir target/plugin-security
      - name: Retain source hashes, logs, corpus, and failure artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: plugin-security-${{ matrix.target }}-${{ github.run_id }}
          path: target/plugin-security
          retention-days: 14
