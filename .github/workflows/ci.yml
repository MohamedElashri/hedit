name: CI
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch or pull request replaces an older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts and debug info only slow down and bloat CI caches.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  check:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      # Seconds, no compiling: fail here before spending minutes on builds.
      - name: Format, documentation, policy, and script checks
        run: make static
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # Only the default branch saves caches; other branches reuse them.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: make clippy
      - name: Tests
        run: make test

  # macOS runs alongside Linux, so platform differences show up before a release.
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: make clippy
      - name: Tests
        run: make test-macos
