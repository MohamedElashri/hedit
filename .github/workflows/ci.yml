name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      validation_only:
        description: Run checks without building Windows release packages
        type: boolean
        default: false
  workflow_call:
    inputs:
      validation_only:
        description: Run checks without building Windows release packages
        type: boolean
        default: false
permissions:
  contents: read
# Replace older runs from the same caller workflow and branch or pull request.
# Reusable release checks must not cancel the normal CI run for that branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts and debug info only slow down and bloat CI caches.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  native-tools:
    name: Native tool boundary (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      RUSTFLAGS: ${{ startsWith(matrix.runner, 'windows-') && '-C target-feature=+crt-static' || '' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: native-tools-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint the shared supervisor and native policy
        run: cargo clippy --locked -p hedit-plugin --all-targets -- -D warnings
      - name: Probe hostile native images through the production boundary
        if: ${{ !cancelled() }}
        run: cargo test --locked -p hedit-plugin --test native_tool
      - name: Verify mandatory integrity against a writable LPAC control
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: cargo test --locked -p hedit-plugin --lib native_tool_integrity_cannot_be_raised_or_disabled -- --nocapture

  windows:
    name: Windows
    uses: ./.github/workflows/windows.yml
    with:
      checks_only: ${{ inputs.validation_only || false }}

  check:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Zig for Ghostty VT
        run: python scripts/setup-zig.py
      # Seconds, no compiling: fail here before spending minutes on builds.
      - name: Format, documentation, policy, and script checks
        run: make static
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # Only the default branch saves caches; other branches reuse them.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: make clippy
      - name: Tests
        run: make test
      - name: Tests without terminal support
        run: cargo test --locked --no-default-features

  # macOS runs alongside Linux, so platform differences show up before a release.
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Zig for Ghostty VT
        run: python scripts/setup-zig.py
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: make clippy
      - name: Tests
        run: make test-macos

  remote-live:
    name: Remote SSH and crash recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare disposable SSH tests
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo systemctl stop ssh.service ssh.socket || true
      - name: Install pinned Zig for the editor integration probe
        run: python scripts/setup-zig.py
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: remote-ssh
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test headless helper
        run: make test-remote
      - name: Real SSH and deterministic client and worker crashes
        run: make test-remote-live
